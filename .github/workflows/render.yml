name: Render Short
run-name: render ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for this render
        required: true
        type: string
      payload:
        description: Scenes, info and voice URLs (JSON)
        required: true
        type: string
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: remotion-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chrome libraries
        run: |
          sudo apt-get update -y
          for p in libnss3 libnspr4 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libasound2; do
            sudo apt-get install -y "$p" >/dev/null 2>&1 || echo "skip $p"
          done
      - name: Prepare assets
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: node prepare.mjs
      - name: Render video
        run: npx remotion render src/index.ts Short out/video.mp4 --props=props.json --codec=h264 --log=info
      - name: Render thumbnail
        run: npx remotion still src/index.ts Thumb out/thumb.jpg --props=props.json --image-format=jpeg --jpeg-quality=80
      - name: Verify audio in final MP4
        run: |
          A=$(npx remotion ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 out/video.mp4 | head -n1)
          D=$(npx remotion ffprobe -v error -show_entries format=duration -of csv=p=0 out/video.mp4 | head -n1)
          echo "audio codec: $A, duration: $D sec"
          if [ -z "$A" ]; then echo "FINAL MP4 me audio stream nahi hai"; exit 1; fi
          V=$(npx remotion ffmpeg -hide_banner -i out/video.mp4 -vn -af volumedetect -f null - 2>&1 | grep max_volume | head -n1 || true)
          echo "$V"
          MAXV=$(echo "$V" | sed -E 's/.*max_volume: (-?[0-9.]+|-inf) dB.*/\1/')
          if [ -z "$MAXV" ] || [ "$MAXV" = "-inf" ] || awk "BEGIN{exit !($MAXV < -50)}"; then echo "FINAL MP4 ki awaaz silent hai"; exit 1; fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" out/video.mp4 out/thumb.jpg --title "$TAG" --notes "Auto render"
