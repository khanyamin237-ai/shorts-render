name: Render Short
run-name: render ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for this render
        required: true
        type: string
      payload:
        description: Scenes, info and voice URLs (JSON)
        required: true
        type: string
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: remotion-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chrome libraries
        run: |
          sudo apt-get update -y
          for p in libnss3 libnspr4 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libasound2; do
            sudo apt-get install -y "$p" >/dev/null 2>&1 || echo "skip $p"
          done
      - name: Prepare assets
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: node prepare.mjs
      - name: Render video
        run: npx remotion render src/index.ts Short out/video.mp4 --props=props.json --codec=h264 --log=info
      - name: Render thumbnail
        run: npx remotion still src/index.ts Thumb out/thumb.jpg --props=props.json --image-format=jpeg --jpeg-quality=80
      - name: Verify audio in final MP4
        run: node verify-audio.mjs out/video.mp4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" out/video.mp4 out/thumb.jpg --title "$TAG" --notes "Auto render"
