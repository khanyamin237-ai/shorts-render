name: Render Short
run-name: render ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for this render
        required: true
        type: string
      payload:
        description: Scenes, info and voice URLs (JSON)
        required: true
        type: string
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install pillow
          sudo apt-get update -y
          sudo apt-get install -y fonts-freefont-ttf libraqm0 libfribidi0 ffmpeg || true
          curl -fL -o hind.ttf https://github.com/google/fonts/raw/main/ofl/hind/Hind-Bold.ttf || true
      - name: Render video
        env:
          PAYLOAD: ${{ inputs.payload }}
          FONT: hind.ttf
        run: python render/render.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" out/video.mp4 out/thumb.jpg --title "$TAG" --notes "Auto render"
