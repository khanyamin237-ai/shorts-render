- name: Verify audio in final MP4
  shell: bash
  run: |
    set -uo pipefail
    F=out/video.mp4

    [ -s "$F" ] || { echo "ERROR: $F missing ya empty hai"; exit 1; }

    A=$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 "$F")
    [ -n "$A" ] || { echo "ERROR: MP4 mein audio stream hai hi nahi"; exit 1; }
    echo "Audio codec: $A"
    ffprobe -v error -show_entries format=duration -of default=nw=1 "$F"

    # poora audio decode hota hai ya nahi
    if ! ffmpeg -v error -i "$F" -vn -f null - 2> decode_err.txt; then
      echo "ERROR: audio decode fail"; cat decode_err.txt; exit 1
    fi
    if [ -s decode_err.txt ]; then
      echo "WARNING: decode warnings:"; cat decode_err.txt
    fi

    # volume measure (output stderr mein aata hai)
    ffmpeg -hide_banner -nostats -i "$F" -vn -af volumedetect -f null - 2> vol.txt || true
    MAX=$(grep -oE 'max_volume: *-?[0-9]+(\.[0-9]+)? dB' vol.txt | grep -oE '\-?[0-9]+(\.[0-9]+)?' | head -1)
    MEAN=$(grep -oE 'mean_volume: *-?[0-9]+(\.[0-9]+)? dB' vol.txt | grep -oE '\-?[0-9]+(\.[0-9]+)?' | head -1)

    if [ -z "$MAX" ]; then
      echo "ERROR: volume measure nahi ho paya, validate nahi kar sakte. Diagnostic:"
      cat vol.txt; exit 1
    fi
    echo "max_volume=${MAX} dB, mean_volume=${MEAN:-NA} dB"

    # -50 dB se neeche = genuinely silent
    if awk "BEGIN{exit !($MAX < -50)}"; then
      echo "ERROR: audio genuinely silent hai (max_volume ${MAX} dB)"; exit 1
    fi
    # 0 dB ke aaspaas = clipping ka khatra
    if awk "BEGIN{exit !($MAX > -0.1)}"; then
      echo "WARNING: clipping ho sakti hai (max_volume ${MAX} dB)"
    fi
    echo "Audio OK"